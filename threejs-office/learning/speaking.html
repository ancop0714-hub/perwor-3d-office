<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8f2ef">
  <title>Perwor · 오늘의 영어 말하기</title>
  <link rel="stylesheet" href="./speaking.css?v=1762612015">
</head>
<body data-perwor-route="speaking">
  <main class="speaking-page">
    <section class="speaking-shell" data-speaking-dedicated aria-label="Perwor 독립 영어 말하기 학습">
      <img class="speaking-reference-image" src="../../assets/3d/scenes/first-person-speaking/perwor-scene-first-person-speaking-v1.png" alt="Perwor 1인칭 영어 말하기 업무 공간 레퍼런스">
      <div class="speaking-partner-motion-layer" data-speaking-partner data-partner-state="idle" data-partner-renderer="reference-image" aria-hidden="true"></div>
      <div class="speaking-label">PERWOR · FIRST-PERSON SPEAKING</div>
      <button class="speaking-back" type="button" data-back-hub>워크스테이션으로 돌아가기 →</button>
      <div class="speaking-prompt-bubble" data-speaking-prompt>업무 상황을 불러오는 중…</div>
      <div class="speaking-monitor-ui"><strong>오늘의 말하기 업무</strong><span data-speaking-monitor>상대방의 업무 요청을 듣고 영어로 답변해보세요.</span></div>
      <div class="speaking-controls">
        <button class="speech-control" type="button" data-speaking-mic>🎙 말하기</button>
        <button class="speech-control secondary" type="button" data-speaking-play>🔊 문장 듣기</button>
        <button class="speech-control secondary" type="button" data-speaking-type>영어로 입력</button>
        <button class="speech-control secondary" type="button" data-speaking-retry disabled>다시 인식</button>
      </div>
      <div class="speech-status" data-speaking-status>마이크를 누르거나 영어로 입력해 답변을 시작하세요.</div>
      <div class="speech-feedback" data-speaking-feedback hidden></div>
      <input class="speech-answer-input" data-speaking-input type="text" autocomplete="off" spellcheck="false" placeholder="영어 답변을 입력하세요" hidden>
      <div class="speech-answer-actions" data-speaking-actions hidden>
        <button type="button" data-speaking-confirm>답변 확인</button>
        <button class="primary" type="button" data-speaking-feedback-action disabled>피드백 받기</button>
      </div>
    </section>
  </main>
  <script src="../learning-bridge.js?v=1762612200"></script>
  <script src="../speaking-partner-renderer.js?v=1762612015"></script>
  <script src="../speaking-image-prototype.js?v=1762612015"></script>
  <script src="./speaking.js?v=1762612015"></script>
</body>
</html>
